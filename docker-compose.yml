name: masar
services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-trixie}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masar}
      POSTGRES_USER: ${POSTGRES_USER:-masar_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1 first}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.local-data/postgres:/var/lib/postgresql
    networks: [data, development]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    shm_size: 128mb
  api:
    profiles: [fullstack]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &api-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-masar}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      IDENTITY_MODE: demo
      ENABLE_PROFESSIONAL_NETWORK: ${ENABLE_PROFESSIONAL_NETWORK:-true}
      AI_MODE: ${AI_MODE:-demo}
      MODEL_GATEWAY_URL: http://model-gateway:8001
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      ALLOWED_ORIGINS: http://127.0.0.1:${MASAR_HTTP_PORT:-5180},http://localhost:${MASAR_HTTP_PORT:-5180}
    volumes:
      - ./.local-data/private:/app/.local-data/private
    networks: [data, inference, web]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
  model-gateway:
    profiles: [fullstack]
    build:
      context: .
      dockerfile: backend/model_gateway/Dockerfile
    environment:
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      MODEL_THREADS: 4
      USER: masar-cpu
    volumes:
      - ./infrastructure/model_artifacts:/app/infrastructure/model_artifacts:ro
    networks: [inference]
    mem_limit: 4g
    cpus: 4
    pids_limit: 128
  worker:
    profiles: [fullstack]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, backend.workers.indexer]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-masar}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      AI_MODE: ${AI_MODE:-demo}
      MODEL_GATEWAY_URL: http://model-gateway:8001
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
    volumes:
      - ./.local-data/private:/app/.local-data/private
    networks: [data, inference]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
  frontend:
    profiles: [fullstack]
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    ports: ["127.0.0.1:${MASAR_HTTP_PORT:-5180}:8080"]
    networks: [web, development]
    depends_on: [api]
networks:
  data:
    internal: true
  development:
    driver: bridge
  inference:
    internal: true
  web:
    internal: true
